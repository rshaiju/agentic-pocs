[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-pocs"
version = "0.1.0"
description = "Agentic proof-of-concepts"
readme = "README.md"
authors = [{ name = "Shaiju" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
	"fastapi>=0.95.0",
	"uvicorn[standard]>=0.20.0",
	"openai>=0.27.0",
	"langchain>=0.0.200",
	"python-dotenv>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]

